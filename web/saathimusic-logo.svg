<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#45B7D1;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#96CEB4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFEAA7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Circle -->
  <circle cx="50" cy="50" r="45" fill="url(#logoGradient)" filter="url(#glow)" opacity="0.9"/>
  
  <!-- Inner Circle -->
  <circle cx="50" cy="50" r="35" fill="url(#innerGradient)" opacity="0.8"/>
  
  <!-- Music Note Symbol -->
  <g transform="translate(50,50)">
    <!-- Main note stem -->
    <rect x="8" y="-20" width="3" height="25" fill="white" opacity="0.9"/>
    
    <!-- Note head -->
    <ellipse cx="5" cy="5" rx="6" ry="4" fill="white" opacity="0.9"/>
    
    <!-- Musical staff lines -->
    <line x1="-15" y1="-10" x2="15" y2="-10" stroke="white" stroke-width="1" opacity="0.6"/>
    <line x1="-15" y1="-5" x2="15" y2="-5" stroke="white" stroke-width="1" opacity="0.6"/>
    <line x1="-15" y1="0" x2="15" y2="0" stroke="white" stroke-width="1" opacity="0.6"/>
    <line x1="-15" y1="5" x2="15" y2="5" stroke="white" stroke-width="1" opacity="0.6"/>
    <line x1="-15" y1="10" x2="15" y2="10" stroke="white" stroke-width="1" opacity="0.6"/>
    
    <!-- Decorative music waves -->
    <path d="M -20,-15 Q -15,-18 -10,-15 Q -5,-12 0,-15" stroke="white" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M 0,15 Q 5,12 10,15 Q 15,18 20,15" stroke="white" stroke-width="2" fill="none" opacity="0.7"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="25" cy="25" r="2" fill="white" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="75" cy="75" r="2" fill="white" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="75" cy="25" r="1.5" fill="white" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="25" cy="75" r="1.5" fill="white" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
