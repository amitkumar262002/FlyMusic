<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#5B73FF;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#FF6B9D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8E53;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="90" fill="url(#logoGradient)" filter="url(#glow)" opacity="0.9"/>
  
  <!-- Inner Dark Circle -->
  <circle cx="100" cy="100" r="65" fill="#1a1a2e" opacity="0.8"/>
  
  <!-- Music Symbol Elements -->
  <!-- Main curved shape -->
  <path d="M 60 80 Q 80 60 120 75 Q 140 85 130 110 Q 120 130 90 125 Q 70 120 60 100 Z" fill="url(#logoGradient)" opacity="0.9"/>
  
  <!-- Music notes/circles -->
  <circle cx="75" cy="90" r="8" fill="#00D4FF" opacity="0.8"/>
  <circle cx="95" cy="85" r="6" fill="#5B73FF" opacity="0.9"/>
  <circle cx="115" cy="95" r="7" fill="#FF6B9D" opacity="0.8"/>
  <circle cx="105" cy="110" r="5" fill="#FF8E53" opacity="0.9"/>
  
  <!-- Additional decorative elements -->
  <ellipse cx="85" cy="105" rx="12" ry="8" fill="#00D4FF" opacity="0.6" transform="rotate(25 85 105)"/>
  <ellipse cx="110" cy="80" rx="10" ry="6" fill="#FF6B9D" opacity="0.7" transform="rotate(-15 110 80)"/>
</svg>
