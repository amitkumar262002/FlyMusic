<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube API Test - FlyMusic AI</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
        }
        .test-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1rem;
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            margin: 5px;
            transition: transform 0.2s ease;
        }
        button:hover {
            transform: translateY(-2px);
        }
        .results {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .song-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .song-thumbnail {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
        }
        .song-info h4 {
            margin: 0 0 5px 0;
            font-size: 1rem;
        }
        .song-info p {
            margin: 0;
            opacity: 0.8;
            font-size: 0.9rem;
        }
        .status {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .status.success {
            background: rgba(46, 204, 113, 0.3);
            border: 1px solid #2ecc71;
        }
        .status.error {
            background: rgba(231, 76, 60, 0.3);
            border: 1px solid #e74c3c;
        }
        .status.info {
            background: rgba(52, 152, 219, 0.3);
            border: 1px solid #3498db;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 YouTube API Test - FlyMusic AI</h1>
        
        <div class="test-section">
            <h3>Step 1: Add Your YouTube API Key</h3>
            <div class="input-group">
                <label for="apiKey">YouTube Data API v3 Key:</label>
                <input type="text" id="apiKey" placeholder="AIzaSyD-BCFeMK9XvTqX1o-v8xCujDv1I1GFnzo" value="AIzaSyD-BCFeMK9XvTqX1o-v8xCujDv1I1GFnzo">
            </div>
            <button onclick="saveApiKey()">Save API Key</button>
            <button onclick="testApiKey()">Test API Key</button>
        </div>

        <div class="test-section">
            <h3>Step 2: Search Music</h3>
            <div class="input-group">
                <label for="searchQuery">Search Query:</label>
                <input type="text" id="searchQuery" placeholder="Arijit Singh" value="Arijit Singh">
            </div>
            <button onclick="searchMusic()">🔍 Search Music</button>
            <button onclick="searchBollywood()">🎬 Search Bollywood</button>
            <button onclick="searchTrending()">🔥 Search Trending</button>
        </div>

        <div id="status"></div>
        <div id="results" class="results" style="display: none;"></div>
    </div>

    <script>
        let apiKey = '';
        
        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        function saveApiKey() {
            const keyInput = document.getElementById('apiKey');
            apiKey = keyInput.value.trim();
            
            if (apiKey) {
                localStorage.setItem('youtube_api_key', apiKey);
                showStatus('✅ API Key saved successfully!', 'success');
            } else {
                showStatus('❌ Please enter a valid API key', 'error');
            }
        }

        async function testApiKey() {
            if (!apiKey) {
                apiKey = document.getElementById('apiKey').value.trim() || localStorage.getItem('youtube_api_key');
            }
            
            if (!apiKey) {
                showStatus('❌ Please add your API key first', 'error');
                return;
            }

            showStatus('🧪 Testing API key...', 'info');

            try {
                const testUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&q=test&maxResults=1&key=${apiKey}`;
                const response = await fetch(testUrl);
                const data = await response.json();

                if (data.error) {
                    showStatus(`❌ API Error: ${data.error.message}`, 'error');
                } else if (data.items && data.items.length > 0) {
                    showStatus('✅ API Key is working perfectly!', 'success');
                } else {
                    showStatus('⚠️ API Key works but no results found', 'info');
                }
            } catch (error) {
                showStatus(`❌ Network Error: ${error.message}`, 'error');
            }
        }

        async function searchMusic() {
            const query = document.getElementById('searchQuery').value.trim();
            if (!query) {
                showStatus('❌ Please enter a search query', 'error');
                return;
            }

            await performSearch(query);
        }

        async function searchBollywood() {
            await performSearch('bollywood hits 2024');
        }

        async function searchTrending() {
            await performSearch('trending music 2024');
        }

        async function performSearch(query) {
            if (!apiKey) {
                apiKey = document.getElementById('apiKey').value.trim() || localStorage.getItem('youtube_api_key');
            }
            
            if (!apiKey) {
                showStatus('❌ Please add your API key first', 'error');
                return;
            }

            showStatus(`🔍 Searching for "${query}"...`, 'info');

            try {
                const searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&q=${encodeURIComponent(query + ' music')}&maxResults=10&key=${apiKey}`;
                const response = await fetch(searchUrl);
                const data = await response.json();

                if (data.error) {
                    showStatus(`❌ API Error: ${data.error.message}`, 'error');
                    return;
                }

                if (data.items && data.items.length > 0) {
                    showStatus(`✅ Found ${data.items.length} results for "${query}"`, 'success');
                    displayResults(data.items);
                } else {
                    showStatus('⚠️ No results found', 'info');
                }
            } catch (error) {
                showStatus(`❌ Search Error: ${error.message}`, 'error');
            }
        }

        function displayResults(items) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.style.display = 'block';
            
            const html = items.map(item => {
                const title = cleanTitle(item.snippet.title);
                const artist = item.snippet.channelTitle;
                const thumbnail = item.snippet.thumbnails.medium?.url || item.snippet.thumbnails.default?.url;
                
                return `
                    <div class="song-item">
                        <img src="${thumbnail}" alt="${title}" class="song-thumbnail" onerror="this.src='https://via.placeholder.com/60x60?text=♪'">
                        <div class="song-info">
                            <h4>${title}</h4>
                            <p>by ${artist}</p>
                        </div>
                    </div>
                `;
            }).join('');
            
            resultsDiv.innerHTML = html;
        }

        function cleanTitle(title) {
            return title
                .replace(/\s*\(Official.*\)/gi, '')
                .replace(/\s*\[Official.*\]/gi, '')
                .replace(/\s*- Official.*/gi, '')
                .replace(/\s*\| Official.*/gi, '')
                .replace(/\s*HD$/gi, '')
                .replace(/\s*4K$/gi, '')
                .trim();
        }

        // Load saved API key on page load
        window.addEventListener('load', () => {
            const savedKey = localStorage.getItem('youtube_api_key');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
                apiKey = savedKey;
                showStatus('📱 Loaded saved API key', 'info');
            }
        });
    </script>
</body>
</html>
